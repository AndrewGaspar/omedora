name: Test

# CI runs the deterministic L1 suite and upstream's Arch CLI contract. Fedora
# L2 and the package/session-backed L3/L4 runners remain explicit local gates.

on:
  push:
    branches: [omedora-4]
  pull_request:
    branches: [omedora-4]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-unit:
    name: L1 shell unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        # Full history + tags: the byte-identity audit diffs every modified
        # upstream file against the omarchy-4 pin TAG, which isn't reachable
        # from a shallow (depth-1) checkout. Other L1 tests don't need this, but
        # it's cheap for this repo and keeps the audit a real gate (not a SKIP).
        with:
          fetch-depth: 0

      - name: Install prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3

      - name: Verify Python 3.11+ (needs tomllib)
        run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11)'

      - name: Run distro detection test
        run: bash test/distro-test.sh

      - name: Run pkg map test
        run: bash test/pkg-map-test.sh

      - name: Run pkg helper test
        run: bash test/pkg-helper-test.sh

      - name: Run adopt-user test
        run: bash test/adopt-user-test.sh

      - name: Run etc-overrides audit
        run: bash test/etc-overrides-audit-test.sh

      - name: Run branding-screensaver audit
        run: bash test/branding-screensaver-test.sh

      - name: Run coexistence plan-gate test
        run: bash test/coexistence-plan-test.sh

      - name: Run coexistence test
        run: bash test/coexistence-test.sh

      - name: Run finalize-defaults test
        run: bash test/finalize-defaults-test.sh

      - name: Run update-flow test
        run: bash test/update-flow-test.sh

      - name: Run powerprofilesctl shim test
        run: bash test/powerprofilesctl-shim-test.sh

      - name: Run tensaku-edit shim test
        run: bash test/tensaku-edit-shim-test.sh

      - name: Run nvim-fedora bootstrap test
        run: bash test/nvim-fedora-test.sh

      - name: Run upgrade-to-4 test
        run: bash test/upgrade-to-4-test.sh

      - name: Run byte-identity audit (upstream files are additive-only)
        run: bash test/byte-identity-test.sh

      - name: Run archism-gating test
        run: bash test/archism-gating-test.sh

      - name: Run migration-gating test
        run: bash test/migration-gating-test.sh

      - name: Run lock-pam-migration test
        run: bash test/lock-pam-migration-test.sh

      - name: Run voxtype-install test
        run: bash test/voxtype-install-test.sh

      - name: Run voxtype-spec static guard
        run: bash test/voxtype-spec-test.sh

      - name: Run tensaku-spec static guard
        run: bash test/tensaku-spec-test.sh

      - name: Run omacut-spec static guard
        run: bash test/omacut-spec-test.sh

      - name: Run omawrite-spec static guard
        run: bash test/omawrite-spec-test.sh

      - name: Run quickshell-spec static guard
        run: bash test/quickshell-spec-test.sh

      - name: Run gpu-screen-recorder-spec static guard
        run: bash test/gpu-screen-recorder-spec-test.sh

      - name: Run HypXR spec static guard
        run: bash test/hypxr-spec-test.sh

      - name: Run ttfx-spec static guard
        run: bash test/ttfx-spec-test.sh

      - name: Validate the real fedora.toml
        run: bin/omarchy-dev-validate-fedora-packages

  arch-contract:
    name: Upstream CLI suite (dual-distro contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run upstream test/cli in Arch container
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            archlinux:latest bash -c '
              pacman -Syu --noconfirm --needed jq python git gum ripgrep fontconfig >/dev/null
              # Upstream CLI behavior must hold byte-for-byte on Arch even
              # with the omedora bins present on the tree.
              bash test/cli
            '
