name: COPR build

# Rebuild the omedora COPR packages whose spec changed, on push to the stable
# line. The build itself runs on COPR (Fedora's infra), so this job just submits
# — it costs ~no CI minutes. Precise: only the specs that changed in the push are
# rebuilt (or an explicit set via workflow_dispatch).
#
# SETUP (one-time): add a repo secret named COPR_API_TOKEN containing the FULL
# contents of your ~/.config/copr token file, e.g.
#   [copr-cli]
#   login = ...
#   username = agaspar
#   token = ...
#   copr_url = https://copr.fedorainfracloud.org
# Without the secret this job no-ops (so forks/PRs don't fail).

on:
  push:
    branches: [omedora-3]
    paths:
      - 'omedora/packaging/copr/**.spec'
      - 'omedora/packaging/copr/**.sources'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to build (default: all specs)'
        required: false

jobs:
  copr-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: a shallow clone can't reach the
                           # push's parent on a multi-commit push (git diff
                           # $before..HEAD then fails with exit 128)

      - name: Gate on the COPR token secret
        id: gate
        env:
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          if [[ -z "$COPR_API_TOKEN" ]]; then
            echo "COPR_API_TOKEN not configured — skipping COPR build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install copr-cli + configure token
        if: steps.gate.outputs.skip == 'false'
        env:
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          pip install --quiet copr-cli
          mkdir -p ~/.config
          printf '%s' "$COPR_API_TOKEN" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Determine which packages to build
        if: steps.gate.outputs.skip == 'false'
        id: pkgs
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            list="${{ github.event.inputs.packages }}"
          else
            before="${{ github.event.before }}"
            # New branch / unknown parent → compare against HEAD~1.
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              before="HEAD~1"
            fi
            list="$(git diff --name-only "$before" "${{ github.sha }}" -- 'omedora/packaging/copr/*.spec' \
                    | xargs -r -n1 basename | sed 's/\.spec$//' | sort -u | tr '\n' ' ')"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Packages to build: ${list:-<none>}"

      - name: Submit COPR builds (no-wait)
        if: steps.gate.outputs.skip == 'false' && steps.pkgs.outputs.list != ''
        env:
          # Keep these in lockstep with omedora/packaging/copr/copr-submit.sh.
          BRANCH: omedora-3
          CLONE_URL: https://github.com/AndrewGaspar/omedora.git
          SUBDIR: omedora/packaging/copr
        run: |
          set -euo pipefail
          project="$(OMARCHY_PATH="$PWD" bin/omedora-copr)"
          echo "COPR project: $project"

          # A brand-new spec has no registered package on COPR yet, so a bare
          # `build-package --name X` fails with "No package with name X in copr".
          # Registration (add-package-scm) is a separate, idempotent step. We
          # therefore upsert each changed package's SCM definition BEFORE building
          # it: try add-package-scm (creates; errors if it already exists), fall
          # back to edit-package-scm (edits; errors if it doesn't). This mirrors
          # copr-submit.sh's register_one() and is safe to repeat on every push.
          register_one() {
            local name="$1"
            local args=(
              --name "$name"
              --clone-url "$CLONE_URL"
              --commit "$BRANCH"
              --subdir "$SUBDIR"
              --spec "$name.spec"
              --type git
              --method make_srpm
              --timeout 18000
              --webhook-rebuild off
            )
            if copr-cli add-package-scm "$project" "${args[@]}" >/dev/null 2>&1; then
              echo "  registered (new):     $name"
            elif copr-cli edit-package-scm "$project" "${args[@]}" >/dev/null 2>&1; then
              echo "  registered (updated): $name"
            else
              echo "  FAILED to register: $name" >&2
              return 1
            fi
          }

          for p in ${{ steps.pkgs.outputs.list }}; do
            echo "==> $p"
            register_one "$p"
            copr-cli build-package "$project" --name "$p" --nowait
          done
