name: COPR build

# Rebuild the omedora COPR packages whose spec changed, on push to the stable
# line. The build itself runs on COPR (Fedora's infra), so this job just submits
# — it costs ~no CI minutes. Precise: only the specs that changed in the push are
# rebuilt (or an explicit set via workflow_dispatch).
#
# SETUP (one-time): add a repo secret named COPR_API_TOKEN containing the FULL
# contents of your ~/.config/copr token file, e.g.
#   [copr-cli]
#   login = ...
#   username = agaspar
#   token = ...
#   copr_url = https://copr.fedorainfracloud.org
# Without the secret this job no-ops (so forks/PRs don't fail).

on:
  push:
    # bin/omedora-copr derives agaspar/omedora-4 from this branch's version
    # file, so spec pushes here submit to the omedora-4 project (live since
    # 2026-06-11). version/omedora-version paths rebuild the self-sourced
    # omedora/omedora-settings packages on release bumps.
    branches: [omarchy-4-omedora]
    paths:
      - 'omedora/packaging/copr/**.spec'
      - 'omedora/packaging/copr/**.sources'
      - 'version'
      - 'omedora/version'
      # Payload of the self-source omedora/omedora-settings packages (built
      # from git archive HEAD): any change here IS a package change — without
      # a rebuild, installed systems keep running the stale snapshot.
      - 'bin/**'
      - 'install/**'
      - 'config/**'
      - 'default/**'
      - 'themes/**'
      - 'shell/**'
      - 'migrations/**'
      - 'applications/**'
      - 'omedora/install/**'
      - 'omedora/install-4.sh'
      - 'omedora/boot.sh'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to build (default: all specs)'
        required: false

jobs:
  copr-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changed-spec diff is against the push's `before`
          # commit, which a shallow clone can't reach when a push lands more
          # than a couple of commits at once (git diff -> exit 128).
          fetch-depth: 0

      - name: Gate on the COPR token secret
        id: gate
        env:
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          if [[ -z "$COPR_API_TOKEN" ]]; then
            echo "COPR_API_TOKEN not configured — skipping COPR build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install copr-cli + configure token
        if: steps.gate.outputs.skip == 'false'
        env:
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          pip install --quiet copr-cli
          mkdir -p ~/.config
          printf '%s' "$COPR_API_TOKEN" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Determine which packages to build
        if: steps.gate.outputs.skip == 'false'
        id: pkgs
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            list="${{ github.event.inputs.packages }}"
          else
            before="${{ github.event.before }}"
            # New branch / unknown parent → compare against HEAD~1.
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              before="HEAD~1"
            fi
            list="$(git diff --name-only "$before" "${{ github.sha }}" -- 'omedora/packaging/copr/*.spec' \
                    | xargs -r -n1 basename | sed 's/\.spec$//' | sort -u | tr '\n' ' ')"
            # Payload changes rebuild the self-source packages (their content
            # is git archive HEAD, not a remote tarball). Settings first —
            # omedora Requires it.
            if git diff --name-only "$before" "${{ github.sha }}" -- \
                 'bin/**' 'install/**' 'config/**' 'default/**' 'themes/**' \
                 'shell/**' 'migrations/**' 'applications/**' \
                 'omedora/install/**' 'omedora/install-4.sh' 'omedora/boot.sh' \
                 'version' 'omedora/version' | grep -q .; then
              for selfpkg in omedora-settings omedora; do
                [[ " $list " == *" $selfpkg "* ]] || list="$list $selfpkg"
              done
            fi
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Packages to build: ${list:-<none>}"

      - name: Submit COPR builds (no-wait)
        if: steps.gate.outputs.skip == 'false' && steps.pkgs.outputs.list != ''
        run: |
          set -euo pipefail
          project="$(OMARCHY_PATH="$PWD" bin/omedora-copr)"
          echo "COPR project: $project"
          for p in ${{ steps.pkgs.outputs.list }}; do
            echo "==> building $p"
            copr-cli build-package "$project" --name "$p" --nowait
          done
