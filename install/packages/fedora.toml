# --- Hyprland ecosystem (vendored omedora RPMs, served from the omedora repo) -
# The whole hyprwm stack is now packaged under omedora/packaging/copr/ and
# resolved via source = "dnf" from the omedora repo (the walker/elephant model).
# The whole stack is built from omedora's own COPR — no third-party COPR (task
# #66). The foundational libs (hyprutils/hyprlang/hyprcursor/hyprgraphics/aquamarine/
# hyprwire/hyprtoolkit/hyprwayland-scanner/hyprland-protocols/glaze) come in
# transitively as dependencies, so only the user-facing names are mapped here.

[hyprland]
source = "dnf"
names = ["hyprland-no-session"]
reason = "Hyprland not in Fedora 44 main repos; vendored as omedora/packaging/copr/hyprland.spec (0.56.1). On the Omarchy-4 line we install the hyprland-no-session subpackage (compositor + libs, NO wayland-sessions entries): omedora-settings ships the only session entry (omedora.desktop), so plain 'Hyprland' entries never appear in GDM. Replaces the retired hyprland-omedora shim, which omedora-settings Obsoletes. (Arch still installs the real hyprland.)"

[hyprland-no-session]
source = "dnf"
names = ["hyprland-no-session"]
reason = "The Hyprland compositor binaries without any wayland-sessions/*.desktop entry (omedora/packaging/copr/hyprland.spec subpackage). The [hyprland] map entry resolves directly to this target; omedora-settings supplies the Omedora login session. Served from the omedora repo."
[hyprland-guiutils]
source = "dnf"
names = ["hyprland-guiutils"]
reason = "The hyprtoolkit-based GUI helpers (successor to hyprland-qtutils); vendored as omedora/packaging/copr/hyprland-guiutils.spec (0.2.2) and served from the omedora repo."

[hyprpicker]
source = "dnf"
names = ["hyprpicker"]
reason = "Vendored as omedora/packaging/copr/hyprpicker.spec (0.4.7); built from omedora's own COPR and served from the omedora repo."

[hyprsunset]
source = "dnf"
names = ["hyprsunset"]
reason = "Vendored as omedora/packaging/copr/hyprsunset.spec (0.4.0); built from omedora's own COPR and served from the omedora repo."

[xdg-desktop-portal-hyprland]
source = "dnf"
names = ["xdg-desktop-portal-hyprland"]
reason = "Vendored as omedora/packaging/copr/xdg-desktop-portal-hyprland.spec (1.4.1); built from omedora's own COPR and served from the omedora repo."

[uwsm]
source = "dnf"
names = ["uwsm"]
reason = "Universal Wayland Session Manager — omedora's session launches through `uwsm start`. Not in Fedora main/RPM Fusion. Vendored as omedora/packaging/copr/uwsm.spec (0.26.5, noarch, adapted from solopasha/hyprlandRPM); built from omedora's own COPR and served from the omedora repo. Without an entry it falls through to plain dnf and aborts the base install (No match for argument: uwsm)."

[gpu-screen-recorder]
source = "dnf"
names = ["gpu-screen-recorder"]
reason = "GPU-accelerated screen recorder (NVENC/VAAPI/Vulkan) that omarchy's screenrecord flow (bin/omarchy-capture-screenrecording) and the Quickshell bar indicator are hardcoded to (`gpu-screen-recorder` binary / `pgrep -f '^gpu-screen-recorder'`); skip-mapping it made recording a silent no-op. Not in Fedora main or RPM Fusion. Built FROM SOURCE (Meson) as omedora/packaging/copr/gpu-screen-recorder.spec (5.14.1, GPL-3.0-only, git.dec05eba.com) and served from the omedora repo. Builds against Fedora main's ffmpeg-free-devel (VAAPI/NVENC/Vulkan encode, not libx264) — NO RPM Fusion needed at build or runtime; all deps resolve from Fedora main. Ships /usr/bin/gpu-screen-recorder + the gsr-kms-server KMS helper (granted CAP_SYS_ADMIN via %post setcap)."

