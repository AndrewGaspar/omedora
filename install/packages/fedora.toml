names = ["compat-lua"]
reason = "Arch's lua51 maps to Fedora's compat-lua (5.1.5). Note the omedora hyprland RPM bundles its own Lua for the config runtime, so this is only for parity with whatever else expects a system Lua 5.1."

[ttf-jetbrains-mono-nerd-basic]
source = "dnf"
names = ["omedora-nerd-fonts"]
reason = "Omarchy 4's renamed basic Nerd Font package; the omedora-nerd-fonts RPM bundles the patched JetBrainsMono (and CascadiaCode) families, same as the pre-4 ttf-jetbrains-mono-nerd mapping."

[pacman-contrib]
source = "skip"
reason = "Provides checkupdates, a pacman tool. The Fedora update-available sibling uses dnf check-upgrade for the same job; nothing to install."

[sddm]
source = "skip"
reason = "Omedora stays on GDM on Fedora — the packaged wayland-session entry makes GDM list the Omedora session, and install/login is Arch-gated. Installing a second display manager would add risk for no benefit."

[moonlight-qt]
source = "flathub"
app_id = "com.moonlight_stream.Moonlight"
reason = "Not in Fedora main or RPM Fusion (verified against both, 2026-06-11); Flathub is the maintained distribution channel."

[voxtype-bin]
source = "dnf"
names = ["voxtype"]
reason = "voxtype-bin (the Arch package) maps to the base 'voxtype' RPM we host in the omedora COPR (omedora/packaging/copr/voxtype.spec) — a subpackaged binary-repackage of upstream's official Fedora RPM: base = CPU(avx2/avx512) + Vulkan + ONNX-CPU (~42 MB). On-demand only (not in any base package set); installed by omarchy-pkg-add via bin/fedora/voxtype-install-pkg, which then auto-detects the GPU and adds voxtype-cuda (NVIDIA) or voxtype-migraphx (AMD). dnf-updatable. wtype resolves natively. Bump = Version: + .sources sha in the spec."

[voxtype-cuda]
source = "dnf"
names = ["voxtype-cuda"]
reason = "Opt-in NVIDIA CUDA ONNX-GPU backend (cuda-12 + cuda-13 provider trees, ~233 MB) for voxtype; subpackage of omedora/packaging/copr/voxtype.spec, served from the omedora repo. Added by bin/fedora/voxtype-install-pkg only when omarchy-hw-nvidia detects an NVIDIA GPU. Requires the base voxtype RPM (cascades on remove)."

[voxtype-migraphx]
source = "dnf"
names = ["voxtype-migraphx"]
reason = "Opt-in AMD ROCm/MIGraphX ONNX-GPU backend (~13 MB) for voxtype; subpackage of omedora/packaging/copr/voxtype.spec, served from the omedora repo. Added by bin/fedora/voxtype-install-pkg only when an AMD/ATI/Radeon GPU is detected via lspci. Requires the base voxtype RPM (cascades on remove)."

[yaru-icon-theme]
source = "dnf"
names = ["yaru-theme"]
reason = "Fedora packages the Yaru icon set inside the yaru-theme package (no standalone yaru-icon-theme). Verify at L3 smoke."
