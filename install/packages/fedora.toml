# --- Hyprland ecosystem (vendored omedora RPMs, served from the omedora repo) -
# The whole hyprwm stack is now packaged under omedora/packaging/copr/ and
# resolved via source = "dnf" from the omedora repo (the walker/elephant model).
# This replaces the dropped third-party lionheartp/Hyprland COPR (task #66). The
# foundational libs (hyprutils/hyprlang/hyprcursor/hyprgraphics/aquamarine/
# hyprwire/hyprtoolkit/hyprwayland-scanner/hyprland-protocols/glaze) come in
# transitively as dependencies, so only the user-facing names are mapped here.

[hyprland]
source = "dnf"
names = ["hyprland-no-session"]
reason = "Hyprland not in Fedora 44 main repos; vendored as omedora/packaging/copr/hyprland.spec (0.55.2). On the Omarchy-4 line we install the hyprland-no-session subpackage (compositor + libs, NO wayland-sessions entries): omedora-settings ships the only session entry (omedora.desktop), so plain 'Hyprland' entries never appear in GDM. Replaces the retired hyprland-omedora shim, which omedora-settings Obsoletes. (Arch still installs the real hyprland.)"

[hyprland-no-session]
source = "dnf"
names = ["hyprland-no-session"]
reason = "The Hyprland compositor binaries without any wayland-sessions/*.desktop entry (omedora/packaging/copr/hyprland.spec subpackage). Not referenced by name in install/omarchy-base.packages — listed here for the validator + clarity, since it is what hyprland-omedora (the [hyprland] remap target) pulls in to provide the compositor. Served from the omedora repo."
[hyprland-guiutils]
source = "dnf"
names = ["hyprland-guiutils"]
reason = "Referenced by name in install/omarchy-base.packages but previously unmapped (latent gap). The hyprtoolkit-based GUI helpers (successor to hyprland-qtutils); vendored as omedora/packaging/copr/hyprland-guiutils.spec (0.2.1) and served from the omedora repo."

[hyprpicker]
source = "dnf"
names = ["hyprpicker"]
reason = "Vendored as omedora/packaging/copr/hyprpicker.spec (0.4.7); served from the omedora repo. Replaces lionheartp/Hyprland."

[hyprsunset]
source = "dnf"
names = ["hyprsunset"]
reason = "Vendored as omedora/packaging/copr/hyprsunset.spec (0.3.3); served from the omedora repo. Replaces lionheartp/Hyprland."

[xdg-desktop-portal-hyprland]
source = "dnf"
names = ["xdg-desktop-portal-hyprland"]
reason = "Vendored as omedora/packaging/copr/xdg-desktop-portal-hyprland.spec (1.3.12); served from the omedora repo. Replaces lionheartp/Hyprland."

[uwsm]
source = "dnf"
names = ["uwsm"]
reason = "Universal Wayland Session Manager — omedora's session launches through `uwsm start`. Not in Fedora main/RPM Fusion; it was implicitly provided by the dropped lionheartp/Hyprland COPR. Vendored as omedora/packaging/copr/uwsm.spec (0.23.3, noarch, adapted from solopasha/hyprlandRPM); served from the omedora repo. Without an entry it falls through to plain dnf and aborts the base install (No match for argument: uwsm)."

[gpu-screen-recorder]
source = "skip"
reason = "GPU screen recorder (NVENC/VAAPI); was implicitly provided by the dropped lionheartp/Hyprland COPR, not Fedora main or RPM Fusion. Not session-critical, and building it needs RPM Fusion ffmpeg BuildRequires the build container doesn't enable. Skipped for now; TODO: vendor it (needs RPM Fusion build deps) or document a manual install for screen recording."

# --- quickshell (vendored omedora RPM, served from the omedora repo) ----------

[quickshell]
source = "dnf"
names = ["quickshell"]
reason = "QtQuick desktop-shell toolkit used by the omarchy-4 Quickshell desktop (e.g. the image selector). Fedora 44 ships only a STALLED Feb-2026 git snapshot (0.2.1^git20260209.dacfa9d, identical on stable/updates/testing/rawhide) that lacks omarchy-4-needed APIs — notably the QsWindow `updatesEnabled` property (its absence breaks the wallpaper/Background component). Vendored as omedora/packaging/copr/quickshell.spec (upstream 0.3.0 release, 2026-05-04) and served from the omedora repo."

