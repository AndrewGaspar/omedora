# --- Omarchy 4.5 additions --------------------------------------------------

[vi]
source = "dnf"
names = ["vim-minimal"]
reason = "Fedora's vi is vim-minimal, which Provides vi. pkg.py verifies installs with rpm -q <name>, so the Provides alone isn't enough; name the real package."

[ffmpeg]
source = "dnf"
names = ["ffmpeg"]
satisfied_by = ["ffmpeg-free"]
reason = "RPM Fusion's full ffmpeg CLI. Omedora enables RPM Fusion, and with it dnf resolves the omedora payload's libavcodec dependency to RPM Fusion's ffmpeg-libs (newer than Fedora's *-free libs), which conflicts with ffmpeg-free, so the matching CLI is RPM Fusion's. The full libraries also decode the H.264 theme intros owe plays. A user already on Fedora's ffmpeg-free stack keeps it (it counts as installed)."

[qt6-base]
source = "dnf"
names = ["qt6-qtbase-devel"]
reason = "Migration 1790702362 adds Qt for building Omarchy-style apps (qmake6 and headers). Arch's qt6-base carries those; on Fedora they are in -devel."

[qt6-declarative]
source = "dnf"
names = ["qt6-qtdeclarative-devel"]
reason = "See qt6-base: development files for building Qt Quick apps."

[qt6-multimedia]
source = "dnf"
names = ["qt6-qtmultimedia-devel"]
reason = "See qt6-base."

[qt6-svg]
source = "dnf"
names = ["qt6-qtsvg-devel"]
reason = "See qt6-base."

[qt6-wayland]
source = "dnf"
names = ["qt6-qtwayland-devel"]
reason = "See qt6-base."

[pipewire-libcamera]
source = "dnf"
names = ["pipewire-plugin-libcamera"]
reason = "Fedora's name for PipeWire's libcamera backend (Qualcomm and ThinkPad T14s camera scripts)."

[omarchy-power-profiles-daemon]
source = "skip"
reason = "Omarchy's power-profiles-daemon fork (ARM cppc profiles). Omedora keeps Fedora's tuned-ppd plus the powerprofilesctl shim (see power-profiles-daemon). The entry must exist: a skip counts as installed, which keeps migration 1791554699's pacman swap from ever being reached."

[slack-desktop]
source = "flathub"
app_id = "com.slack.Slack"
reason = "4.5's Install > Service > Slack. Slack ships no Fedora repo package we can pull; Flathub's com.slack.Slack is the maintained Linux build. omarchy-install-and-launch launches it by its Flatpak app id on Fedora."

[superwhisper-bin]
source = "skip"
reason = "Proprietary vendor tarball (tux.superwhisper.com), not redistributable through a COPR (same reasoning as claude-code). It is 4.5's default dictation backend; on Fedora dictation stays unbound until a backend is installed (Setup > Defaults > Dictation > Voxtype uses the COPR voxtype RPM)."

[omasnap]
source = "dnf"
names = ["omasnap"]
reason = "4.5's screenshot + annotation overlay (Qt6/C++, github.com/omacom/omasnap, MIT). omarchy-capture-screenshot execs it. Not in Fedora; built from source by omedora/packaging/copr/omasnap.spec (CMake, no vendoring). Needs a COPR build before the 4.5 release."

[owe]
source = "dnf"
names = ["owe"]
reason = "Omarchy's video wallpaper engine (C/meson, github.com/omacom/owe): theme intro and video backgrounds, owed.service, and the theme-set sync hook. Not in Fedora; built from source by omedora/packaging/copr/owe.spec. Needs a COPR build before the 4.5 release."

[owe-lockfeed]
source = "skip"
reason = "owe's lock-screen QML feed plugin. 4.5's lock screen uses a still poster, not the feed, and owe.spec doesn't build the plugin yet. Only migration 1789764927 asks for it."

[omarchy-hyprland-titlebars]
source = "skip"
reason = "Hyprland plugin (hyprbars fork) for 4.5's floating-workspace mode. Not packaged: a plugin loads only into the exact Hyprland build it was compiled against, so it would need an exact-EVR Requires and a rebuild with every hyprland.spec build (and its HypXR consumers). workspace-modes.lua skips titlebars when the .so is absent."

[hype]
source = "dnf"
names = ["hype"]
reason = "Markdown slides app (Qt6, github.com/omacom/hype), a removable preinstall. Not in Fedora; built from source by omedora/packaging/copr/hype.spec (qmake6, like omacut). Requires ffmpeg/ffprobe by path and source-highlight."

[monologue]
source = "dnf"
