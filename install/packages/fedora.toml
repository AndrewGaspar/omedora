[signed]
source = "dnf"
names = ["signed"]
reason = "PDF signing/filling app (Qt6 + poppler-qt6 + qpdf, github.com/omacom/signed), a removable preinstall. Not in Fedora; built from source by omedora/packaging/copr/signed.spec (qmake6, like omacut)."

[gliff]
