# --- Source-installed (no Fedora repo + no Flathub) ----------------------

# Currently no source installers shipped (install/packages/installers/ has
# only README.md). Marking these as `skip` for now so the install transaction
# completes; revisit with real source installers in a follow-up.

[mise]
source = "dnf"
names = ["mise"]
reason = "Not in Fedora repos or RPM Fusion. Upstream ships a prebuilt linux-x64 tarball; binary-repackaged by omedora/packaging/copr/mise.spec (binary + man page + fish activation snippet)."

[claude-code]
source = "skip"
reason = "Anthropic's CLI is a proprietary self-contained Bun binary (downloads.claude.ai), not an npm/distro package. Users install via Anthropic's official installer; enterprises via their own deployment. An omedora RPM exists (omedora/packaging/copr/claude-code.spec, mirrors omarchy) but is deliberately parked — excluded from build-repo.sh — pending a redistribution-licensing decision before any public COPR."

[omarchy-nvim]
source = "dnf"
names = ["omarchy-nvim"]
reason = "omarchy's prebuilt LazyVim distribution (config + baked plugin cache + omarchy-nvim-setup), NOT a plain config clone. Built from source by omedora/packaging/copr/omarchy-nvim.spec (reproduces the omacom-io/omarchy-pkgs PKGBUILD; headless Lazy sync). install/packaging/nvim.sh already invokes omarchy-nvim-setup."

[omarchy-walker]
source = "dnf"
names = ["walker", "elephant"]
reason = "AUR meta pulling walker + elephant; neither is in Fedora repos. Both are packaged as RPMs in omedora/packaging/copr/ (walker pulls gtk4-layer-shell, elephant pulls qalculate for the calc provider's qalc CLI + ships its providers and user service) and served from the omedora repo (local now, COPR later)."

[starship]
source = "dnf"
names = ["starship"]
reason = "Not in Fedora repos or RPM Fusion. Upstream ships a prebuilt x86_64 binary; binary-repackaged by omedora/packaging/copr/starship.spec."

[lazygit]
source = "dnf"
names = ["lazygit"]
reason = "Not in Fedora main or RPM Fusion; atim/lazygit COPR not on the allowlist. Binary-repackaged from upstream's prebuilt release tarball (omedora/packaging/copr/lazygit.spec); resolves to the omedora-repo RPM."

[lazydocker]
source = "dnf"
names = ["lazydocker"]
reason = "Not in Fedora main or RPM Fusion; atim/lazydocker COPR not on the allowlist. Binary-repackaged from upstream's prebuilt release tarball (omedora/packaging/copr/lazydocker.spec)."

[swayosd]
source = "dnf"
names = ["swayosd"]
reason = "Not in Fedora main repos and ships no prebuilt binaries, so the omedora swayosd RPM (omedora/packaging/copr/swayosd.spec) builds it from source via meson+cargo. Served from the omedora repo (local now, COPR later). Provides swayosd-server/-client (omedora drives them via its own user unit + ~/.config/swayosd theme) plus the libinput backend glue; fixes the swayosd-server.service 203/EXEC crash-loop."

[satty]
source = "dnf"
names = ["satty"]
reason = "Wayland screenshot annotation (Rust/GTK4). Not in Fedora repos/RPM Fusion, and — despite being a GUI — NOT on Flathub (verified against Flathub appstream+search). Built from source by omedora/packaging/copr/satty.spec."

[bluetui]
source = "dnf"
names = ["bluetui"]
reason = "Bluetooth TUI (Rust). Not in Fedora repos/RPM Fusion; a TUI is not a Flathub fit. Built from source by omedora/packaging/copr/bluetui.spec (Requires bluez)."

[hyprland-preview-share-picker]
source = "dnf"
names = ["hyprland-preview-share-picker"]
reason = "Rust (edition 2024) GTK4 xdph share picker. Not in Fedora main/RPM Fusion or the allowlisted lionheartp/Hyprland COPR. Built from source by omedora/packaging/copr/hyprland-preview-share-picker.spec (hyprland-protocols submodule fetched at a pinned commit). Runtime dep xdg-desktop-portal-hyprland comes from lionheartp/Hyprland."

[ttf-ia-writer]
