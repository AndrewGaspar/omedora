reason = "Disk-usage treemap GUI (tobi/disktree, MIT), 4.5's dua-cli replacement. Not in Fedora; omedora/packaging/copr/disktree.spec repackages the upstream x86_64 release binary, as Arch's disktree-bin does (like lazygit.spec)."

