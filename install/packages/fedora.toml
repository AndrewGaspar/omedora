# --- Source-installed (no Fedora repo + no Flathub) ----------------------

# Currently no source installers shipped (install/packages/installers/ has
# only README.md). Marking these as `skip` for now so the install transaction
# completes; revisit with real source installers in a follow-up.

[mise]
source = "dnf"
names = ["mise"]
reason = "Not in Fedora repos or RPM Fusion. Upstream ships a prebuilt linux-x64 tarball; binary-repackaged by omedora/packaging/copr/mise.spec (binary + man page + fish activation snippet)."

[claude-code]
source = "skip"
reason = "Anthropic's CLI is a proprietary self-contained Bun binary (downloads.claude.ai), not an npm/distro package. Users install via Anthropic's official installer; enterprises via their own deployment. An omedora RPM exists (omedora/packaging/copr/claude-code.spec, mirrors omarchy) but is deliberately parked — excluded from build-repo.sh — pending a redistribution-licensing decision before any public COPR."

[omarchy-nvim]
source = "skip"
reason = "Not packaged as an RPM on Fedora: the omarchy-nvim build bakes its plugin cache via a headless `:Lazy! sync` that fetches ~50 plugins from GitHub, which fails in COPR's offline mock build. Nothing Requires it (it's just user-level Neovim config + a setup script). Instead install/packaging/nvim.sh bootstraps the same commit-pinned config (omacom-io/omarchy-pkgs) directly on the user's networked machine and runs Lazy sync there. The retired spec/sources remain in omedora/packaging/copr/ (dropped from build-repo.sh) for reference."
[starship]
source = "dnf"
names = ["starship"]
reason = "Not in Fedora repos or RPM Fusion. Upstream ships a prebuilt x86_64 binary; binary-repackaged by omedora/packaging/copr/starship.spec."

[lazygit]
source = "dnf"
names = ["lazygit"]
reason = "Not in Fedora main or RPM Fusion; atim/lazygit COPR not on the allowlist. Binary-repackaged from upstream's prebuilt release tarball (omedora/packaging/copr/lazygit.spec); resolves to the omedora-repo RPM."

[lazydocker]
