# Package map: Arch package name -> Fedora install source.
#
# Absence from this file means the Arch name resolves identically on Fedora's
# main repos. Add an entry only when:
#   - The Fedora package name differs from the Arch name, OR
#   - The package isn't in Fedora main repos (needs RPM Fusion, COPR, Flathub,
#     or source), OR
#   - The package should be deliberately skipped on Fedora (with a reason).
#
# Schema and tier rules are documented in omedora/packages.md.
# Validate this file with `omarchy dev validate-fedora-packages`.

# --- Renamed packages (different name, in Fedora main) -------------------

[ttf-jetbrains-mono-nerd]
source = "dnf"
names = ["omedora-nerd-fonts"]
reason = "Fedora's plain jetbrains-mono-fonts-all lacks the Nerd Font icon glyphs (waybar/terminal tofu). The omedora-nerd-fonts RPM (omedora/packaging/copr/) bundles the patched CascadiaCode + JetBrainsMono families; served from the omedora repo (local now, COPR later). Covers ttf-cascadia-mono-nerd too."

[ttf-cascadia-mono-nerd]
source = "dnf"
names = ["omedora-nerd-fonts"]
reason = "Same omedora-nerd-fonts RPM as ttf-jetbrains-mono-nerd (it bundles both families)."

[woff2-font-awesome]
source = "dnf"
names = ["fontawesome-fonts-all"]
reason = "On Fedora 44 the FontAwesome metapackage is 'fontawesome-fonts-all' (pulls all variants). 'fontawesome-fonts' is unavailable."

