# Package map: Arch package name -> Fedora install source.
#
# Absence from this file means the Arch name resolves identically on Fedora's
# main repos. Add an entry only when:
#   - The Fedora package name differs from the Arch name, OR
#   - The package isn't in Fedora main repos (needs RPM Fusion, COPR, or
#     Flathub), OR
#   - The package should be deliberately skipped on Fedora (with a reason).
#
# An optional `satisfied_by = [...]` lists RPMs that already cover an entry
# when installed (another provider, or one that Conflicts with `names`): the
# entry then counts as installed and its names are never pulled in. Those
# packages are the user's; omedora never installs, removes, or replaces them.
#
# Schema and tier rules are documented in omedora/packages.md.
# Validate this file with `omarchy dev validate-fedora-packages`.

