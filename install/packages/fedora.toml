# --- Omedora COPR packages and explicit skips ----------------------------

[mise]
source = "dnf"
names = ["mise"]
reason = "Not in Fedora repos or RPM Fusion. Upstream ships a prebuilt linux-x64 tarball; binary-repackaged by omedora/packaging/copr/mise.spec (binary + man page + fish activation snippet)."

[mise-bin]
source = "dnf"
names = ["mise"]
reason = "Omarchy 4.0.2 renamed the base package to Arch's PGO+BOLT-optimized mise-bin (built from mise's own release artifacts in the omarchy repo). Omedora keeps serving its binary-repackaged mise RPM (omedora/packaging/copr/mise.spec) under the same name; the Fedora-gated migration skips Arch's package-replacement transaction."

[claude-code]
source = "skip"
reason = "Anthropic's CLI is a proprietary self-contained Bun binary (downloads.claude.ai), not an npm/distro package. Users install via Anthropic's official installer; enterprises via their own deployment. An omedora RPM exists (omedora/packaging/copr/claude-code.spec, mirrors omarchy) but is deliberately parked — excluded from build-repo.sh — pending a redistribution-licensing decision before any public COPR."

[grok-bot]
source = "skip"
reason = "Quattro exposes Grok Bot as an optional menu install, but no grok-bot RPM is available from Fedora, RPM Fusion, or Omedora's enabled repository. Skip instead of letting the menu launch a guaranteed failing dnf transaction; revisit when a redistributable package source exists."

[omarchy-nvim]
source = "skip"
reason = "Not packaged as an RPM on Fedora: the omarchy-nvim build bakes its plugin cache via a headless `:Lazy! sync` that fetches ~50 plugins from GitHub, which fails in COPR's offline mock build. Nothing Requires it (it's just user-level Neovim config + a setup script). Instead install/packaging/nvim.sh bootstraps the same commit-pinned config (omacom-io/omarchy-pkgs) directly on the user's networked machine and runs Lazy sync there. The retired spec/sources remain in omedora/packaging/copr/ (dropped from build-repo.sh) for reference."
[starship]
source = "dnf"
names = ["starship"]
reason = "Not in Fedora repos or RPM Fusion. Upstream ships a prebuilt x86_64 binary; binary-repackaged by omedora/packaging/copr/starship.spec."

[lazygit]
source = "dnf"
names = ["lazygit"]
reason = "Not in Fedora main or RPM Fusion; atim/lazygit COPR not on the allowlist. Binary-repackaged from upstream's prebuilt release tarball (omedora/packaging/copr/lazygit.spec); resolves to the omedora-repo RPM."

[lazydocker]
source = "dnf"
names = ["lazydocker"]
reason = "Not in Fedora main or RPM Fusion; atim/lazydocker COPR not on the allowlist. Binary-repackaged from upstream's prebuilt release tarball (omedora/packaging/copr/lazydocker.spec)."
[satty]
source = "dnf"
names = ["satty"]
reason = "Wayland screenshot annotation (Rust/GTK4). Not in Fedora repos/RPM Fusion, and — despite being a GUI — NOT on Flathub (verified against Flathub appstream+search). Built from source by omedora/packaging/copr/satty.spec."
[tensaku]
source = "dnf"
names = ["tensaku"]
reason = "The quattro line's screenshot/clipboard annotation editor (dev.tensaku.Tensaku; a Satty fork, Rust/GTK4). Not in Fedora repos/RPM Fusion; built from source by omedora/packaging/copr/tensaku.spec (hermetic vendored cargo build, like satty). Ships /usr/bin/tensaku plus the /usr/bin/tensaku-edit wrapper omarchy-capture-screenshot/-clipboard-open/imv invoke, so omedora adopts it natively. omedora still keeps satty (independent tool) and the tensaku-edit -> satty shim (install/user/tensaku-edit-shim-fedora.sh), which self-deactivates once this package provides the real /usr/bin/tensaku-edit."
[omacut]
source = "dnf"
names = ["omacut"]
reason = "Dead-simple video length trimmer (Qt6/QML + ffmpeg; github.com/omacom-io/omacut, MIT), a quattro-line omarchy-family app. Not in Fedora repos/RPM Fusion; built from source by omedora/packaging/copr/omacut.spec (plain qmake6 build, no vendoring). Ships /usr/bin/omacut; requires ffmpeg/ffprobe (by path, so ffmpeg-free satisfies it) + xdg-desktop-portal for its file picker."
[omawrite]
source = "dnf"
names = ["omawrite"]
reason = "Dead-simple Markdown writing app bound to SUPER+SHIFT+W (Qt6/QML; github.com/omacom-io/omawrite, MIT), a quattro-line omarchy-family app. Not in Fedora repos/RPM Fusion; built from source by omedora/packaging/copr/omawrite.spec (plain qmake6 build, no vendoring). Ships /usr/bin/omawrite. Upstream's Arch package pulls the proprietary ttf-ia-writer font, which omedora skip-maps ([ttf-ia-writer]); this RPM deliberately does NOT require it (Qt substitutes a fallback monospace by family name), so the app installs and runs without it — wiring the font is a separate deferred item."

[omacalc]
source = "dnf"
names = ["omacalc"]
reason = "Quattro's Qt Quick calculator (omacom-io/omacalc), invoked directly by the calculator keybindings. Not in Fedora main/RPM Fusion; built from source by omedora/packaging/copr/omacalc.spec and served from the omedora repo."

[ttfx]
source = "dnf"
names = ["ttfx"]
reason = "Native Rust terminal-effects engine used directly by Quattro's screensaver and first-boot provisioner. Not in Fedora main/RPM Fusion; built from source by omedora/packaging/copr/ttfx.spec and served from the omedora repo. Replaces the older python3-terminaltexteffects runtime."

[herdr]
source = "dnf"
names = ["herdr"]
reason = "Terminal workspace manager built from Omarchy's pinned omacom-io/herdr fork. Not in Fedora main/RPM Fusion; built from source by omedora/packaging/copr/herdr.spec and served from the omedora repo alongside tmux."

[hyprland-preview-share-picker]
source = "dnf"
names = ["hyprland-preview-share-picker"]
reason = "Rust (edition 2024) GTK4 xdph share picker. Not in Fedora main/RPM Fusion. Built from source by omedora/packaging/copr/hyprland-preview-share-picker.spec (hyprland-protocols submodule fetched at a pinned commit). Runtime dep xdg-desktop-portal-hyprland is vendored in the omedora COPR (xdg-desktop-portal-hyprland.spec)."

[ghostty]
source = "copr"
copr = "scottames/ghostty"
names = ["ghostty"]
reason = "Zig GPU terminal, offered via Menu > Install > Terminal > Ghostty (on-demand; NOT a base package — foot is the base terminal). Not in Fedora main/RPM Fusion. An in-house vendored build is impractical right now: ghostty pins zig 0.15.x while Fedora 44 ships zig 0.16, so we'd have to also vendor a pinned zig plus ghostty's ~25 source archives and re-pin every release. scottames/ghostty is the ghostty-docs-endorsed, actively-maintained canonical Fedora COPR — a deliberate allowlist exception (packages.md §3). The COPR is enabled lazily by pkg.py only when the user actually installs ghostty from the menu (never at base install), so no third-party repo is added to a machine unless the user opts in. TODO: revisit vendoring once ghostty builds against Fedora's zig (or omedora ships a pinned zig)."

[ttf-ia-writer]
source = "skip"
reason = "Proprietary iA Writer font is not redistributable through Fedora or Omedora's COPR. Users must install it from its licensed upstream source."

[python-terminaltexteffects]
source = "dnf"
names = ["python3-terminaltexteffects"]
reason = "The `tte` terminal-effects CLI; not in Fedora main repos. Packaged from source as an RPM in omedora/packaging/copr/ (pure Python, no runtime deps; ships /usr/bin/tte) and served from Omedora's COPR."

[tzupdate]
source = "skip"
reason = "TODO: pip install. Fedora has timedatectl set-timezone for the same purpose."

[usage]
