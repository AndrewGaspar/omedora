reason = "The `tte` terminal-effects CLI; not in Fedora main repos. Packaged from-source as an RPM in omedora/packaging/copr/ (pure Python, no runtime deps; ships /usr/bin/tte) and served from the omedora repo (local now, COPR later)."

[tzupdate]
